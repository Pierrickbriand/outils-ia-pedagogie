<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier IA et vente</title>
<meta name="description" content="Parcours guidé de 14 heures : régler Claude, explorer l'IA dans la vente, concevoir son outil d'aide à la vente et son mini-dossier.">
<meta name="robots" content="noindex">
<style>
:root{
  --fond:#F8FAFC; --carte:#FFFFFF; --encre:#0F172A; --texte:#334155; --discret:#64748B;
  --trait:#E2E8F0; --trait-fort:#CBD5E1; --creux:#F1F5F9;
  --accent:#059669; --accent-fonce:#047857; --accent-nuit:#065F46; --accent-pale:#ECFDF5; --accent-trait:#A7F3D0;
  --rouge:#B91C1C; --rouge-pale:#FEF2F2; --rouge-trait:#FECACA;
  --ambre:#B45309; --ambre-pale:#FFFBEB; --ambre-trait:#FDE68A;
  --sans:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --nav:280px; --etat:300px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--sans);font-size:16px;line-height:1.55}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--accent-fonce);text-underline-offset:3px}
a:hover{color:var(--accent-nuit)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
[hidden]{display:none!important}

/* Panneaux flottants */
.flottant{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--trait-fort)}

/* Barre d'actions, en haut à gauche */
.colonne{position:fixed;z-index:40;top:12px;left:12px;bottom:12px;width:var(--nav);display:flex;flex-direction:column;gap:8px}
.barre{padding:8px}
.barre-actions{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.barre-actions button{height:32px;padding:0 6px;font-size:12.5px;font-weight:600;background:var(--carte);border:1px solid var(--trait-fort);cursor:pointer;white-space:nowrap}
.barre-actions button:hover{border-color:var(--accent);color:var(--accent-nuit)}
.barre-actions button.plein{background:var(--accent-fonce);border-color:var(--accent-fonce);color:#fff}
.barre-actions button.plein:hover{background:var(--accent-nuit);color:#fff}
.barre-etat{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--discret);line-height:1.3}
.barre-etat i{flex:none;width:8px;height:8px;background:var(--accent)}
.barre-etat.alerte i{background:var(--ambre)}
.barre-mobile{display:none}

/* Navigation */
.nav{flex:1;min-height:0;overflow:auto;padding:6px 0 12px}
.nav h2{font-size:12.5px;font-weight:600;color:var(--discret);padding:14px 14px 6px}
.nav a{display:flex;align-items:baseline;gap:8px;padding:8px 14px;color:var(--texte);text-decoration:none;font-size:14.5px;line-height:1.3;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.9)}
.nav a[aria-current="page"]{background:var(--carte);border-left-color:var(--accent);color:var(--encre);font-weight:600}
.nav a span{flex:1}
.nav a small{flex:none;font-size:12px;color:var(--discret);font-weight:400;font-variant-numeric:tabular-nums}
.nav a.complet small{color:var(--accent-fonce);font-weight:600}
.nav-global{margin:14px 14px 0;font-size:12.5px;color:var(--discret)}
.nav-global b{color:var(--encre)}
.filet{height:6px;background:var(--trait);margin-top:6px}
.filet i{display:block;height:100%;background:var(--accent)}

/* Zone principale */
main{margin:0 calc(var(--etat) + 36px) 0 calc(var(--nav) + 36px);padding:28px 0 120px;min-height:100vh}
.page{max-width:760px;margin:0 auto}
.tete{padding:8px 0 22px}
.tete .seance{font-size:14px;color:var(--discret)}
.tete h1{font-size:clamp(28px,3.4vw,38px);line-height:1.08;letter-spacing:-.022em;font-weight:700;color:var(--encre);margin:6px 0 12px;text-wrap:balance}
.tete .chapo{font-size:18px;line-height:1.5;color:var(--texte);max-width:62ch}

.bloc{background:var(--carte);border:1px solid var(--trait);padding:20px 22px;margin-bottom:14px}
.bloc h2{font-size:19px;line-height:1.25;color:var(--encre);font-weight:650;letter-spacing:-.01em}
.bloc h3{font-size:15.5px;color:var(--encre);font-weight:650;margin-top:18px}
.bloc p{margin-top:10px;max-width:68ch}
.bloc p:first-child{margin-top:0}
.bloc ul.tirets{margin-top:10px}
.bloc ul.tirets li{position:relative;padding-left:22px;margin-top:5px;max-width:66ch}
.bloc ul.tirets li::before{content:"–";position:absolute;left:4px;color:var(--accent-fonce);font-weight:700}
.bloc ol.pas{counter-reset:pas;margin-top:12px}
.bloc ol.pas>li{counter-increment:pas;position:relative;padding-left:34px;margin-top:9px;max-width:66ch}
.bloc ol.pas>li::before{content:counter(pas);position:absolute;left:0;top:1px;width:22px;height:22px;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--accent-nuit);background:var(--accent-pale);border:1px solid var(--accent-trait)}
.note{font-size:14px;color:var(--discret)}
.duree{font-size:13px;color:var(--discret);font-weight:400;margin-left:8px;white-space:nowrap}

/* Étape à cocher */
.etape{border-left:3px solid var(--trait-fort)}
.etape.faite{border-left-color:var(--accent)}
.etape-tete{display:flex;align-items:flex-start;gap:14px;justify-content:space-between}
.fait{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--discret);cursor:pointer;user-select:none;padding:4px 9px;border:1px solid var(--trait-fort);background:var(--carte)}
.fait input{appearance:none;-webkit-appearance:none;width:14px;height:14px;margin:0;border:1.5px solid var(--discret);background:#fff;display:grid;place-items:center;cursor:pointer}
.fait input:checked{background:var(--accent-fonce);border-color:var(--accent-fonce)}
.fait input:checked::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.etape.faite .fait{color:var(--accent-nuit);border-color:var(--accent-trait);background:var(--accent-pale)}

/* Repère */
.repere{background:var(--accent-pale);border:1px solid var(--accent-trait);border-left:3px solid var(--accent)}
.repere h2{font-size:16.5px}
.repere .verif{font-size:13px;color:var(--accent-nuit);margin-top:12px}
.sources{margin-top:12px;font-size:14px}
.sources li{margin-top:4px;padding-left:22px;position:relative}
.sources li::before{content:"↗";position:absolute;left:3px;color:var(--accent-fonce)}

/* Champs */
.champs{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:14px}
.champ{display:flex;flex-direction:column;gap:5px;min-width:0}
.champ.large{grid-column:1/-1}
.champ>span.l{font-size:14px;font-weight:600;color:var(--encre)}
.champ>span.l em{font-style:normal;font-weight:400;color:var(--discret)}
.champ .aide{font-size:13px;color:var(--discret);line-height:1.4}
.champ input[type=text],.champ input[type=number],.champ input[type=date],.champ textarea,.champ select{width:100%;padding:9px 11px;border:1px solid var(--trait-fort);background:#fff;border-radius:0;line-height:1.45}
.champ textarea{resize:vertical;min-height:72px}
.champ input:focus,.champ textarea:focus,.champ select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.coches{display:grid;gap:6px;margin-top:12px}
.coche{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.coche input{margin:4px 0 0;width:16px;height:16px;accent-color:var(--accent-fonce);flex:none}

/* Consigne à copier */
.consigne{margin-top:14px;border:1px solid var(--trait-fort);background:var(--creux)}
.consigne-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--trait-fort);background:#fff}
.consigne-tete b{font-size:14px;color:var(--encre)}
.consigne pre{margin:0;padding:14px;font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;color:var(--encre)}
.consigne pre .vide{color:var(--ambre);background:var(--ambre-pale)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;font-size:14px;font-weight:600;background:var(--carte);border:1px solid var(--trait-fort);cursor:pointer;text-decoration:none;color:var(--encre);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-nuit)}
.btn.plein{background:var(--accent-fonce);border-color:var(--accent-fonce);color:#fff}
.btn.plein:hover{background:var(--accent-nuit);color:#fff}
.btn.ok{background:var(--accent-pale);border-color:var(--accent);color:var(--accent-nuit)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* Décision */
.decision{border-top:3px solid var(--encre)}
.decision .q{font-size:19px;font-weight:650;color:var(--encre);line-height:1.25;letter-spacing:-.01em}
.decision .genre{font-size:13px;color:var(--discret);margin-bottom:4px}
.options{display:grid;gap:8px;margin-top:14px}
.option{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--trait-fort);background:#fff;cursor:pointer}
.option:hover{border-color:var(--accent)}
.option input{margin:4px 0 0;accent-color:var(--accent-fonce);width:16px;height:16px;flex:none}
.option.choisi{border-color:var(--accent);background:var(--accent-pale);box-shadow:inset 3px 0 0 var(--accent)}
.suite{margin-top:14px;padding:12px 14px;background:var(--creux);border-left:3px solid var(--encre)}
.suite.grave{background:var(--rouge-pale);border-left-color:var(--rouge);color:#7F1D1D}
.effets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.effet{font-size:12.5px;font-weight:600;padding:2px 8px;border:1px solid var(--trait-fort);background:#fff;font-variant-numeric:tabular-nums}
.effet.bon{border-color:var(--accent-trait);color:var(--accent-nuit);background:var(--accent-pale)}
.effet.mauvais{border-color:var(--rouge-trait);color:var(--rouge);background:var(--rouge-pale)}

/* Scène */
.scene{background:var(--encre);border-color:var(--encre);color:#CBD5E1}
.scene .genre{font-size:13px;color:#94A3B8}
.scene h2{color:#fff;font-size:21px;margin-top:2px}
.scene p{color:#E2E8F0;font-size:16.5px}
.scene .reps{display:grid;gap:8px;margin-top:16px}
.scene .rep{text-align:left;padding:11px 14px;background:transparent;border:1px solid #475569;color:#F1F5F9;cursor:pointer;line-height:1.4}
.scene .rep:hover{border-color:#6EE7B7}
.scene .rep.choisi{background:var(--accent-fonce);border-color:var(--accent-fonce);color:#fff}
.scene .suite{background:#1E293B;border-left-color:#6EE7B7;color:#E2E8F0}
.scene .effet{background:#1E293B;border-color:#475569;color:#E2E8F0}
.scene .effet.bon{color:#6EE7B7;border-color:#065F46;background:#1E293B}
.scene .effet.mauvais{color:#FCA5A5;border-color:#7F1D1D;background:#1E293B}
.scene .verrou{color:#94A3B8;font-size:15px}
.scene .champ>span.l{color:#fff}
.scene .champ textarea{background:#fff;color:var(--encre)}
.scene :focus-visible{outline-color:#6EE7B7}

/* Schéma */
.schema{margin-top:14px;border:1px solid var(--trait-fort);background:#fff}
.schema svg{display:block;width:100%;height:auto;background:var(--fond)}
.schema img{display:block;width:100%;height:auto;border-top:1px solid var(--trait-fort)}
.schema figcaption{padding:12px 14px;border-top:1px solid var(--trait-fort);font-size:14.5px}
.schema figcaption ol{counter-reset:leg}
.schema figcaption li{counter-increment:leg;position:relative;padding-left:30px;margin-top:5px}
.schema figcaption li::before{content:counter(leg);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accent-fonce);color:#fff;font-size:12px;font-weight:700}
.schema figcaption .note{margin-top:9px}

/* Tableaux */
.tab{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.tab th{text-align:left;font-weight:600;color:var(--encre);padding:7px 8px;border-bottom:2px solid var(--encre);vertical-align:bottom;line-height:1.25}
.tab td{padding:6px 6px;border-bottom:1px solid var(--trait);vertical-align:top}
.tab td input,.tab td textarea,.tab td select{width:100%;padding:7px 8px;border:1px solid var(--trait-fort);background:#fff;border-radius:0;font-size:14px;line-height:1.4}
.tab td textarea{resize:vertical;min-height:54px}
.tab.donnees{font-family:var(--mono);font-size:12px}
.tab.donnees th{font-weight:600;border-bottom-width:1px}
.defile{overflow-x:auto}

/* Idées */
.idees{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.idee{border:1px solid var(--trait-fort);padding:14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.idee.choisie{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.idee .fam{font-size:12.5px;color:var(--discret)}
.idee h3{margin:0;font-size:16px}
.idee p{margin:0;font-size:14px;line-height:1.45}
.idee .niv{display:flex;gap:3px;align-items:center;font-size:12.5px;color:var(--discret)}
.idee .niv i{width:14px;height:6px;background:var(--trait)}
.idee .niv i.on{background:var(--accent)}
.idee .btn{align-self:flex-start;margin-top:auto}

/* Parcours des deux séances */
.parcours{margin-top:14px;border-left:3px solid var(--accent)}
.parcours li{padding:10px 0 10px 18px;border-bottom:1px solid var(--trait);position:relative}
.parcours li:last-child{border-bottom:0}
.parcours li::before{content:"";position:absolute;left:-8px;top:17px;width:13px;height:13px;background:var(--accent)}
.parcours li.entre::before{background:#fff;border:3px solid var(--accent)}
.parcours b{display:block;color:var(--encre)}

/* Résultats chiffrés */
.resultats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border:1px solid var(--trait-fort)}
.resultats div{padding:12px 14px;border-right:1px solid var(--trait);border-bottom:1px solid var(--trait);background:#fff}
.resultats div:nth-child(3n){border-right:0}
.resultats dt{font-size:13px;color:var(--discret);line-height:1.3}
.resultats dd{margin:4px 0 0;font-size:22px;font-weight:700;color:var(--encre);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.resultats dd.neg{color:var(--rouge)}
.resultats dd small{font-size:13px;font-weight:400;color:var(--discret)}

/* État du projet */
.etat{position:fixed;z-index:30;top:12px;right:12px;width:var(--etat);max-height:calc(100vh - 24px);overflow:auto;padding:16px}
.etat h2{font-size:15px;color:var(--encre);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.etat h2 button{display:none}
.jauge{margin-top:14px}
.jauge-l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px}
.jauge-l b{color:var(--encre);font-weight:650}
.jauge-l span{color:var(--discret);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:5px}
.seg i{height:10px;background:var(--trait)}
.seg.vert i.on{background:var(--accent)}
.seg.neutre i.on{background:#475569}
.seg.ambre i.on{background:#D97706}
.seg.rouge i.on{background:var(--rouge)}
.jauge small{display:block;font-size:12px;color:var(--discret);margin-top:3px}
.etat h3{font-size:13.5px;color:var(--encre);margin-top:18px;padding-top:12px;border-top:1px solid var(--trait-fort)}
.alertes{margin-top:8px;display:grid;gap:6px}
.alerte{display:block;font-size:13px;line-height:1.4;padding:8px 10px;border:1px solid var(--trait-fort);border-left-width:3px;background:#fff;text-decoration:none;color:var(--texte)}
.alerte.rouge{border-color:var(--rouge-trait);border-left-color:var(--rouge);background:var(--rouge-pale);color:#7F1D1D}
.alerte.orange{border-color:var(--ambre-trait);border-left-color:var(--ambre);background:var(--ambre-pale);color:#78350F}
.alerte.info{border-left-color:var(--discret)}
a.alerte:hover{border-color:var(--encre)}
.calme{font-size:13px;color:var(--discret);margin-top:8px}
.bouton-etat{display:none}

/* Pied de chapitre */
.pied{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* Rappel, message bref, dialogue */
.rappel{position:fixed;z-index:50;left:50%;bottom:16px;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-color:var(--ambre);font-size:14.5px;color:var(--encre)}
.rappel div{display:flex;gap:6px;flex:none}
.bref{position:fixed;z-index:60;left:50%;bottom:76px;transform:translateX(-50%);background:var(--encre);color:#fff;padding:8px 14px;font-size:14px;font-weight:600}
dialog{border:1px solid var(--encre);padding:0;width:min(480px,calc(100vw - 32px));border-radius:0;color:var(--texte)}
dialog::backdrop{background:rgba(15,23,42,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog form{padding:22px}
dialog h2{font-size:19px;color:var(--encre)}
dialog p{margin-top:10px}
dialog .actions{justify-content:flex-end;margin-top:20px}

/* Aperçu du dossier */
.dossier{background:#fff;color:var(--encre);font-size:14.5px;line-height:1.5}
.dossier .couv{border-bottom:3px solid var(--encre);padding-bottom:14px;margin-bottom:18px}
.dossier .couv h1{font-size:26px;line-height:1.15;letter-spacing:-.015em;margin:4px 0 8px}
.dossier .couv p{margin:2px 0;color:var(--texte)}
.dossier h2{font-size:17px;margin:22px 0 8px;padding-top:10px;border-top:1px solid var(--trait-fort);color:var(--encre)}
.dossier h3{font-size:14.5px;margin:12px 0 2px;color:var(--encre)}
.dossier p{margin:3px 0;max-width:none;white-space:pre-wrap;overflow-wrap:anywhere}
.dossier .vide{color:var(--ambre);font-style:italic}
.dossier dl{margin:6px 0;display:grid;grid-template-columns:minmax(150px,32%) 1fr;gap:3px 14px}
.dossier dt{color:var(--discret)}
.dossier dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dossier table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
.dossier th,.dossier td{border:1px solid var(--trait-fort);padding:5px 7px;text-align:left;vertical-align:top;white-space:pre-wrap}
.dossier th{background:var(--creux)}
.dossier .jauges{break-inside:avoid}
.dossier .jg{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:4px 0}
.dossier .jg .seg{margin:0}
.dossier ul{margin:6px 0}
.dossier ul li{padding-left:18px;position:relative;margin:3px 0}
.dossier ul li::before{content:"–";position:absolute;left:2px}
.dossier pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--creux);padding:10px;margin:6px 0;border:1px solid var(--trait)}
#impression{display:none}

/* Écrans moyens : l'état devient un volet */
@media (max-width:1239px){
  main{margin-right:24px}
  .etat{display:none;box-shadow:0 12px 40px rgba(15,23,42,.18)}
  .etat.ouvert{display:block}
  .etat h2 button{display:inline-flex}
  .bouton-etat{display:flex;position:fixed;z-index:29;right:12px;top:12px;align-items:center;gap:8px;height:40px;padding:0 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--encre)}
  .bouton-etat .pastilles{display:flex;gap:3px}
  .bouton-etat .pastilles i{width:8px;height:14px;background:var(--accent)}
  .bouton-etat .pastilles i.neutre{background:#475569}
  .bouton-etat .pastilles i.ambre{background:#D97706}
  .bouton-etat .pastilles i.rouge{background:var(--rouge)}
  .page{padding-top:44px}
}
/* Petits écrans : la navigation devient un volet */
@media (max-width:899px){
  main{margin:0;padding:112px 16px 120px}
  .page{padding-top:0}
  .colonne{top:0;left:0;right:0;bottom:auto;width:auto;gap:0}
  .barre{border-width:0 0 1px;padding:8px 12px}
  .barre-actions{grid-template-columns:repeat(4,1fr)}
  .barre-mobile{display:flex;gap:4px;margin-top:6px}
  .barre-mobile button{flex:1;height:32px;font-size:13px;font-weight:600;background:var(--carte);border:1px solid var(--trait-fort);cursor:pointer}
  .barre-etat{display:none}
  .bouton-etat{display:none}
  .nav{display:none;position:fixed;top:87px;left:0;right:0;bottom:0;border-width:0;background:rgba(255,255,255,.97)}
  .nav.ouvert{display:block}
  .etat{top:87px;right:0;left:0;width:auto;max-height:calc(100vh - 87px);border-width:0 0 1px;background:rgba(255,255,255,.97)}
  .champs,.idees{grid-template-columns:1fr}
  .resultats{grid-template-columns:1fr 1fr}
  .resultats div:nth-child(3n){border-right:1px solid var(--trait)}
  .resultats div:nth-child(2n){border-right:0}
  .bloc{padding:16px}
  .etape-tete{flex-direction:column;gap:10px}
  .tab.large-mobile{min-width:640px}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.option,.rep,.nav a{transition:border-color .12s,background-color .12s}
}

/* Impression : seul le dossier sort */
@page{size:A4;margin:16mm 15mm}
@media print{
  html,body{background:#fff}
  body>*:not(#impression){display:none!important}
  #impression{display:block}
  .dossier{font-size:10.5pt}
  .dossier h2{break-after:avoid}
  .dossier h3{break-after:avoid}
  .dossier table,.dossier .jg,.dossier dl>*{break-inside:avoid}
  .seg i,.dossier th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<div class="colonne">

/* ───────── Jeux de données fictifs, différents pour chaque étudiant ───────── */
function graine(texte) {
  let h = 2166136261;
  for (let i = 0; i < texte.length; i++) { h ^= texte.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function hasard(g) {
  let a = g || 1;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const entre = (r, a, b) => Math.round(a + r() * (b - a));
const pioche = (r, liste) => liste[Math.floor(r() * liste.length)];

function jeuClients(nom, particuliers) {
  const r = hasard(graine('clients|' + (nom || 'atelier').toLowerCase().trim()));
  const secteurs = ['industrie', 'bâtiment', 'commerce de détail', 'restauration', 'transport', 'services aux entreprises', 'santé', 'agriculture'];
  const zones = ['centre-ville', 'périphérie', 'bourg', 'rural'];
  const canaux = particuliers ? ['e-mail', 'SMS', 'téléphone', 'magasin'] : ['e-mail', 'téléphone', 'visite', 'salon'];
  const origines = particuliers ? ['achat en magasin', 'formulaire web', 'jeu concours', 'fichier acheté'] : ['client historique', 'formulaire web', 'salon', 'fichier acheté'];
  const profils = [
    { n: 7, anc: [24, 96], jours: [3, 30], cmd: [8, 20], ca: [18000, 60000], ouv: [35, 70], note: [8, 10] },
    { n: 9, anc: [18, 80], jours: [20, 75], cmd: [4, 9], ca: [6000, 20000], ouv: [20, 55], note: [6, 9] },
    { n: 8, anc: [1, 8], jours: [5, 45], cmd: [1, 3], ca: [800, 5000], ouv: [30, 75], note: [6, 10] },
    { n: 7, anc: [30, 110], jours: [150, 340], cmd: [0, 2], ca: [0, 3000], ouv: [0, 18], note: [3, 7] },
    { n: 5, anc: [36, 120], jours: [95, 200], cmd: [1, 4], ca: [9000, 30000], ouv: [5, 25], note: [2, 6] }
  ];
  const lignes = [];
  profils.forEach(p => {
    for (let i = 0; i < p.n; i++) {
      const cmd = entre(r, p.cmd[0], p.cmd[1]);
      let ca = cmd === 0 ? 0 : entre(r, p.ca[0], p.ca[1]);
      if (particuliers) ca = Math.round(ca / 40);
      lignes.push({
        a: particuliers ? pioche(r, zones) : pioche(r, secteurs),
        b: particuliers ? (r() < 0.55 ? 'oui' : 'non') : entre(r, 4, 420),
        anc: entre(r, p.anc[0], p.anc[1]), jours: entre(r, p.jours[0], p.jours[1]), cmd, ca,
        canal: pioche(r, canaux), ouv: entre(r, p.ouv[0], p.ouv[1]), note: String(entre(r, p.note[0], p.note[1])),
        origine: pioche(r, origines)
      });
    }
  });
  for (let i = lignes.length - 1; i > 0; i--) { const k = Math.floor(r() * (i + 1)); [lignes[i], lignes[k]] = [lignes[k], lignes[i]]; }
  lignes.forEach((l, i) => { l.id = 'C' + String(i + 1).padStart(3, '0'); });
  /* Trois anomalies volontaires */
  const n = lignes.length;
  const x1 = entre(r, 2, 9), x2 = entre(r, 12, 20), x3 = entre(r, 24, n - 2);
  lignes[x1].note = ''; lignes[(x1 + 11) % n].note = '';
  lignes[x2].id = lignes[x2 - 1].id;
  lignes[x3].cmd = 0; lignes[x3].jours = 0; lignes[x3].ca = particuliers ? 310 : 12400;
  const entete = ['id', particuliers ? 'zone' : 'secteur', particuliers ? 'carte_fidelite' : 'effectif', 'anciennete_mois', 'jours_depuis_derniere_commande', 'commandes_12_mois', 'ca_12_mois_eur', 'canal_prefere', 'taux_ouverture_emails_pct', 'note_satisfaction_10', 'origine_contact'];
  const corps = lignes.map(l => [l.id, l.a, l.b, l.anc, l.jours, l.cmd, l.ca, l.canal, l.ouv, l.note, l.origine]);
  return { entete, corps, csv: [entete].concat(corps).map(l => l.join(';')).join('\n') };
}

function jeuMessages(nom) {

  const canaux = ['e-mail', 'formulaire', 'avis en ligne', 'agent en ligne', 'téléphone (transcrit)'];
  const gardes = MESSAGES.filter(m => m[0] === 1);
  const autres = MESSAGES.filter(m => m[0] === 0);
  for (let i = autres.length - 1; i > 0; i--) { const k = Math.floor(r() * (i + 1)); [autres[i], autres[k]] = [autres[k], autres[i]]; }
  const choisis = gardes.concat(autres.slice(0, 24 - gardes.length));
  for (let i = choisis.length - 1; i > 0; i--) { const k = Math.floor(r() * (i + 1)); [choisis[i], choisis[k]] = [choisis[k], choisis[i]]; }
  const entete = ['id', 'date', 'canal', 'client_depuis_mois', 'message'];
  const corps = choisis.map((m, i) => {
    const jour = entre(r, 0, 25);
    const d = new Date(Date.UTC(2026, 8, 15 + jour));
    return ['M' + String(i + 1).padStart(2, '0'), d.toISOString().slice(0, 10), pioche(r, canaux), entre(r, 1, 96), m[1]];
  });
  return { entete, corps, csv: [entete].concat(corps).map(l => l.join(';')).join('\n') };

/* Typographie française : espaces insécables, apostrophes, milliers */
function typo(t) {
  return String(t)
    .replace(/(\p{L})'(?=\p{L}|«)/gu, '$1’')
    .replace(/« /g, '« ').replace(/ »/g, ' »')
    .replace(/ ([:;!?])/g, ' $1')
    .replace(/(\d) (\d{3})(?!\d)/g, '$1 $2')
    .replace(/(\d) h (\d)/g, '$1 h $2')
    .replace(/(\d) (%|€|h|min|heures?|minutes?|jours?|semaines?|mois|ans?)(?![\p{L}])/gu, '$1 $2')
    .replace(/n° /g, 'n° ');
}
function typoNoeuds(racine) {
  const marcheur = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      const p = n.parentElement;
      if (!p || p.closest('pre,textarea,script,style,[data-brut]')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const noeuds = []; while (marcheur.nextNode()) noeuds.push(marcheur.currentNode);
  noeuds.forEach(n => { const t = typo(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; });
  racine.querySelectorAll('[placeholder]').forEach(e => e.setAttribute('placeholder', typo(e.getAttribute('placeholder'))));
}

/* Ordre de calcul : les choix d'un chapitre, puis la scène qui en découle */
const ORDRE = [
  ['d', 'donnees'], ['d', 'comptes'], ['d', 'qualif'], ['d', 'offre'], ['s', 's_ao'],
  ['d', 'prix'], ['d', 'reunions'], ['s', 's_compte'],
  ['d', 'perimetre'], ['d', 'technique'], ['d', 'prevision'], ['s', 's_j10'], ['d', 'preuve']
];
function appliquer(j, e) { Object.keys(e || {}).forEach(k => { j[k] = borne(j[k] + e[k]); }); }
function calcul() {
  const j = {}; Object.keys(JAUGES).forEach(k => { j[k] = JAUGES[k].base; });
  const variantes = {};
  ORDRE.forEach(([type, id]) => {
    if (type === 'd') {
      const o = DECISIONS[id].options.find(x => x.id === S.choix[id]);
      if (o) appliquer(j, o.e);
    } else {
      const sc = SCENES[id];
      if (!sc.dependDe.every(d => S.choix[d])) { variantes[id] = null; return; }
      const va = sc.variantes.find(x => x.si({ j: Object.assign({}, j), choix: S.choix }));
      variantes[id] = va;
      const rep = S.scenes[id] && S.scenes[id][va.id];
      const r = va.reps.find(x => x.id === rep);
      if (r) appliquer(j, r.e);
    }
  });
  const c = S.choix;
  const drap = {
    donneesReelles: c.donnees === 'reelles', decideursFiches: c.comptes === 'tout', scoreSeul: c.qualif === 'seul', cdcColle: c.offre === 'tout',
    prixAuto: c.prix === 'auto', reunionCachee: c.reunions === 'cache', tropLarge: c.perimetre === 'plateforme',
    chiffreSeul: c.prevision === 'optimiste', preuveFaible: c.preuve === 'externe'
  };
  /* Question du jury : le point le plus faible */
  const faiblesse = { risque: j.risque, charge: j.charge, confiance: 100 - j.confiance, sobriete: 100 - j.sobriete };
  const faible = Object.keys(faiblesse).sort((a, b) => faiblesse[b] - faiblesse[a])[0];
  return { j, variantes, drap, faible };
}
function niveau(k, x) {
  const g = JAUGES[k], r = g.sens < 0 ? (x <= 30 ? 0 : x <= 50 ? 1 : x <= 64 ? 2 : 3) : (x >= 70 ? 0 : x >= 50 ? 1 : x >= 36 ? 2 : 3);
  return [['vert', 'neutre', 'ambre', 'rouge'][r], g.niv[r]];
}
function alertes(C) {
  const a = [], d = C.drap, j = C.j;
  if (d.donneesReelles) a.push(['rouge', `Données réelles : change ton choix à l'étape 2 avant d'aller plus loin.`, 'filrouge']);
  if (d.cdcColle) a.push(['rouge', `Cahier des charges du client chargé sans accord : relis ton engagement de confidentialité.`, 'atelier1']);
  if (d.decideursFiches) a.push(['rouge', `Décideurs fichés sans objectif précis : ne garde que leur fonction.`, 'atelier1']);
  if (d.reunionCachee) a.push(['rouge', `Réunions transcrites à l'insu des participants.`, 'atelier2']);
  if (d.scoreSeul) a.push(['orange', `Affaires écartées par le score seul : prévois une revue humaine.`, 'atelier1']);
  if (d.prixAuto) a.push(['orange', `Remises accordées sans validation : fixe un seuil.`, 'atelier2']);
  if (d.chiffreSeul) a.push(['orange', `Chiffre présenté sans fourchette ni hypothèses.`, 'fabrique']);
  if (d.tropLarge || j.charge >= 65) a.push(['orange', `Périmètre trop large pour le 27 novembre.`, 'fabrique']);
  if (j.sobriete <= 35) a.push(['orange', `Ton outil collecte ou calcule plus que nécessaire.`, 'dossier']);
  if (j.confiance <= 35) a.push(['orange', `Confiance fragile : que sait le client de ton outil ?`, 'dossier']);
  if (d.preuveFaible) a.push(['orange', `Retour sur investissement sans mesure personnelle.`, 'dossier']);
  const sansJustif = Object.keys(DECISIONS).filter(id => S.choix[id] && !rempli('j_' + id)).length;
  if (sansJustif) a.push(['info', sansJustif === 1 ? `Un choix reste sans justification.` : sansJustif + ` choix restent sans justification.`, null]);
  return a;
}

/* ───────── Registre et aides de rendu ───────── */
const REG = { etapes: {}, champs: {}, decisions: {}, scenes: {} };
let CH = null; /* chapitre en cours de rendu */

function champ(cle, libelle, o) {
  o = o || {};
  REG.champs[cle] = { l: libelle, ch: CH, requis: !!o.requis };
  const val = v(cle, o.defaut);
  const facultatif = o.requis ? '' : ' <em>(facultatif)</em>';
  let saisie;
  if (o.type === 'zone') saisie = `<textarea data-champ="${cle}" rows="${o.lignes || 3}" placeholder="${esc(o.ex || '')}">${esc(val)}</textarea>`;
  else if (o.type === 'liste') saisie = `<select data-champ="${cle}">${[['', 'Choisir…']].concat(o.options).map(x => `<option value="${esc(x[0])}"${String(val) === String(x[0]) ? ' selected' : ''}>${esc(x[1])}</option>`).join('')}</select>`;
  else saisie = `<input type="text"${o.type === 'nombre' ? ' inputmode="decimal"' : ''} data-champ="${cle}" value="${esc(val)}" placeholder="${esc(o.ex || '')}" autocomplete="off">`;
  return `<label class="champ${o.large ? ' large' : ''}"><span class="l">${libelle}${o.sansMention ? '' : facultatif}</span>${saisie}${o.aide ? `<span class="aide">${o.aide}</span>` : ''}</label>`;
}
function coche(cle, libelle, defaut) {
  REG.champs[cle] = { l: libelle, ch: CH, requis: false, coche: true };
  const on = v(cle, defaut ? 'oui' : 'non') === 'oui';
  return `<label class="coche"><input type="checkbox" data-coche="${cle}"${on ? ' checked' : ''}><span>${libelle}</span></label>`;
}
const estCoche = (cle, defaut) => v(cle, defaut ? 'oui' : 'non') === 'oui';

function etape(id, titre, duree, corps) {
  REG.etapes[id] = CH;
  const fait = !!S.faits[id];
  return `<section class="bloc etape${fait ? ' faite' : ''}" id="e-${id}">
    <div class="etape-tete"><h2>${titre}${duree ? `<span class="duree">${duree}</span>` : ''}</h2>
    <label class="fait"><input type="checkbox" data-fait="${id}"${fait ? ' checked' : ''}>Fait</label></div>
    ${corps}</section>`;
}
function bloc(titre, corps, classe) { return `<section class="bloc${classe ? ' ' + classe : ''}">${titre ? `<h2>${titre}</h2>` : ''}${corps}</section>`; }
function liens(ids) { return `<ul class="sources">${ids.map(i => `<li><a href="${SOURCES[i].u}" target="_blank" rel="noopener">${SOURCES[i].t}</a></li>`).join('')}</ul>`; }
function repere(titre, corps, ids) {
  return `<section class="bloc repere"><h2>${titre}</h2>${corps}${ids ? liens(ids) + `<p class="verif">Repères vérifiés le ${VERIFIE_LE} sur les sources officielles. Le droit change : relis la source avant de la citer.</p>` : ''}</section>`;
}
function tirets(items) { return `<ul class="tirets">${items.map((x, i) => `<li>${x}${/[?!]$/.test(x) ? '' : i === items.length - 1 ? '.' : ' ;'}</li>`).join('')}</ul>`; }

function consigne(id, titre) {

const VIDE = '⟦à compléter⟧';
const ou = (cle, defaut) => rempli(cle) ? String(v(cle)).trim() : (defaut || VIDE);

function effets(e) {
  const k = Object.keys(e || {}); if (!k.length) return '';
  return `<div class="effets">${k.map(x => { const bon = (e[x] * JAUGES[x].sens) > 0; return `<span class="effet ${bon ? 'bon' : 'mauvais'}">${JAUGES[x].l} ${e[x] > 0 ? '+' : '−'}${Math.abs(e[x])}</span>`; }).join('')}</div>`;
}
function decision(id) {

  const d = DECISIONS[id], choisi = S.choix[id], o = d.options.find(x => x.id === choisi);

      ${d.sources ? liens(d.sources) : ''}` : `<p class="note" style="margin-top:12px">Ton choix modifie l'état du projet, affiché à droite.</p>`}
  </section>`;

function scene(id, C) {
  REG.scenes[id] = CH;

  const rep = S.scenes[id] && S.scenes[id][va.id], r = va.reps.find(x => x.id === rep);
  return `<section class="bloc scene" id="s-${id}"><p class="genre">Une scène, née de tes choix</p><h2>${sc.titre}</h2><p>${va.texte}</p>
    <div class="reps">${va.reps.map(x => `<button type="button" class="rep${x.id === rep ? ' choisi' : ''}" data-scene="${id}" data-variante="${va.id}" data-rep="${x.id}" aria-pressed="${x.id === rep}">${x.l}</button>`).join('')}</div>
    ${r ? `<div class="suite">${r.suite}</div>${effets(r.e)}` : ''}</section>`;

/* Progression */
function progression(ch, C) {
  let total = 0, fait = 0;
  Object.keys(REG.etapes).forEach(id => { if (REG.etapes[id] === ch) { total++; if (S.faits[id]) fait++; } });
  Object.keys(REG.decisions).forEach(id => { if (REG.decisions[id] === ch) { total++; if (S.choix[id]) fait++; } });
  Object.keys(REG.scenes).forEach(id => { if (REG.scenes[id] === ch) { total++; const va = C.variantes[id]; if (va && S.scenes[id] && S.scenes[id][va.id]) fait++; } });
  return [fait, total];
}

/* ───────── Retour sur investissement, diagnostic, dossier ───────── */
function roi() {
  const avant = num('roi_avant'), apres = num('roi_apres'), occ = num('roi_occ'), users = num('roi_users');
  const sem = num('roi_semaines', '44'), cout = num('roi_cout'), conc = num('roi_conception'), maint = num('roi_maintenance');
  const abos = isNaN(num('roi_abos', '0')) ? 0 : num('roi_abos', '0'), reutil = isNaN(num('roi_reutil', '50')) ? 50 : num('roi_reutil', '50');
  const r = { ok: false };
  if ([avant, apres, occ, users, sem].some(isNaN)) return r;
  r.heures = (avant - apres) * occ * users * sem / 60;
  if ([cout, conc, maint].some(isNaN)) return r;
  r.valeur = r.heures * cout * reutil / 100;
  r.cout = (conc + maint) * cout + abos;
  r.net = r.valeur - r.cout;
  r.taux = r.cout > 0 ? r.net / r.cout * 100 : NaN;
  r.mois = r.valeur > 0 ? r.cout / (r.valeur / 12) : NaN;
  r.netBas = r.valeur / 2 - r.cout;
  r.ok = true;
  return r;
}
function majRoi() {
  const z = document.getElementById('roi-sortie'); if (!z) return;
  const r = roi(), e = x => nb(x) + ' €';
  const c = (t, val, neg) => `<div><dt>${t}</dt><dd${neg ? ' class="neg"' : ''}>${val}</dd></div>`;
  z.innerHTML = c('Heures gagnées par an', r.heures === undefined ? '–' : nb(r.heures) + ' h', r.heures < 0)
    + c('Valeur du temps réutilisé', r.ok ? e(r.valeur) : '–') + c('Coût la première année', r.ok ? e(r.cout) : '–')
    + c('Gain net la première année', r.ok ? e(r.net) : '–', r.ok && r.net < 0)
    + c('Retour sur investissement', r.ok && isFinite(r.taux) ? nb(r.taux) + ' %' : '–', r.ok && r.taux < 0)
    + c('Délai de retour', r.ok && isFinite(r.mois) && r.mois > 0 ? nb(r.mois, 1) + ' mois' : '–');
  const b = document.getElementById('roi-basse');
  b.textContent = r.ok ? typo(`Hypothèse basse, avec un gain divisé par deux : ${r.netBas >= 0 ? 'gain net de' : 'perte de'} ${nb(Math.abs(r.netBas))} € la première année.`) : typo(`Remplis les huit premières cases : le calcul s'affiche ici.`);
}
function majTaux() {
  const z = document.getElementById('a2-taux'); if (!z) return;
  const n = num('a2_verifies'), d = num('a2_desaccords');
  if (isNaN(n) || isNaN(d) || n <= 0 || d > n || d < 0) { z.textContent = typo(`Saisis les deux nombres : ton taux d'accord s'affiche ici.`); return; }
  const t = (n - d) / n * 100;
  z.textContent = typo(`Taux d'accord : ${nb(t)} %. Sur 500 messages par mois, cela ferait environ ${nb(500 * d / n)} clients mal orientés.`);
}

function diagnostic(C) {
  const j = C.j, d = C.drap, faibles = [];
  if (j.risque >= 65) faibles.push('le risque juridique');
  if (j.charge >= 65) faibles.push('la charge de travail');
  if (j.confiance <= 35) faibles.push('la confiance');
  if (j.sobriete <= 35) faibles.push('la sobriété');
  const nbChoix = Object.keys(DECISIONS).filter(k => S.choix[k]).length;
  let titre;
  if (nbChoix < 3) titre = `Diagnostic provisoire : fais d'abord tes choix`;
  else if (!faibles.length) titre = `Projet maîtrisé`;
  else if (faibles.length === 1) titre = `Projet solide, avec un point faible : ${faibles[0]}`;
  else titre = `Projet à reprendre sur ${faibles.length} points`;
  const ph = [];
  ph.push(j.risque <= 30 ? `Risque juridique : ton projet reste dans un cadre que tu sais expliquer.` : j.risque < 65 ? `Risque juridique : des points restent à sécuriser avant un usage réel.` : `Risque juridique : ton projet expose l'entreprise. Un usage réel demanderait l'avis du délégué à la protection des données.`);
  ph.push(j.charge <= 50 ? `Charge de travail : le périmètre tient dans le temps disponible.` : j.charge < 65 ? `Charge de travail : le périmètre est tendu. Chaque ajout se paie.` : `Charge de travail : le périmètre dépasse le temps disponible.`);
  ph.push(j.confiance >= 70 ? `Confiance : clients et équipe savent ce que fait l'outil et gardent un recours.` : j.confiance > 35 ? `Confiance : elle tient, mais certains choix peuvent surprendre un client.` : `Confiance : plusieurs choix mettent le client devant le fait accompli.`);
  ph.push(j.sobriete >= 70 ? `Sobriété : l'outil utilise peu de données et sollicite l'IA quand elle sert.` : j.sobriete > 35 ? `Sobriété : l'outil pourrait se passer de certaines données ou de certains appels à l'IA.` : `Sobriété : l'outil collecte et calcule plus que nécessaire.`);
  if (nbChoix < 3) { ph.length = 0; ph.push(`Tu n'as pas encore fait assez de choix pour un diagnostic. Avance dans les étapes 2 à 5, puis reviens ici.`); }
  const testsFaits = [1, 2, 3].filter(n => rempli('t' + n + '_cas') && v('t' + n + '_ok')).length;
  const retours = [1, 2].filter(n => rempli('r' + n + '_qui')).length;
  const R = roi();
  /* Plan d'action séquencé : 0 = cette semaine, 1 = avant le 27 novembre, 2 = après le module */
  const pool = [
    [0, d.donneesReelles, `Supprimer les données réelles de tes conversations et repartir sur un jeu fictif.`],
    [0, d.cdcColle, `Retirer le cahier des charges du client de tes conversations et prévenir ton tuteur.`],
    [0, d.reunionCachee, `Annoncer la transcription au début de chaque réunion, ou la couper.`],
    [0, d.decideursFiches, `Supprimer les données privées des décideurs et ne garder que leur fonction.`],
    [0, d.prixAuto || d.scoreSeul, `Remettre une validation humaine sur les prix et sur les affaires écartées.`],
    [0, testsFaits < 3, `Terminer les trois tests et corriger les écarts.`],
    [0, true, `Enregistrer ton fichier de projet et ranger ton outil dans ton dossier « Atelier vente ».`],
    [1, j.charge >= 60, `Réduire le périmètre à la fonction qui marche, et la terminer.`],
    [1, retours < 2, `Faire tester l'outil par deux personnes et noter leurs retours.`],
    [1, d.preuveFaible || !R.ok, `Chronométrer la tâche avant et après, sur cinq cas au moins.`],
    [1, d.chiffreSeul, `Ajouter une fourchette et tes hypothèses à chaque chiffre produit par l'outil.`],
    [1, true, `Préparer la démonstration sur un cas, avec le calcul refait à la main.`],
    [2, j.risque >= 51, `Faire relire l'outil par le délégué à la protection des données, avant tout usage réel.`],
    [2, j.sobriete <= 45, `Remplacer par une règle simple chaque étape où l'IA n'apporte rien.`],
    [2, j.confiance <= 45, `Écrire en trois lignes ce que le client doit savoir, et où il le lira.`],
    [2, true, `Rédiger un mode d'emploi d'une page : usage, limites, personne qui vérifie.`],
    [2, true, `Décider avec ton tuteur qui fait vivre l'outil après ton départ.`]
  ];
  const temps = [`Cette semaine`, `Avant le 27 novembre`, `Après le module`].map((t, i) => ({ t, a: pool.filter(x => x[0] === i && x[1]).slice(0, 3).map(x => x[2]) }));
  return { titre, phrases: ph, alertes: alertes(C).filter(a => a[0] !== 'info').map(a => a[1]), temps };
}

function manques(C) {
  const m = [];
  Object.keys(REG.champs).forEach(k => {
    const c = REG.champs[k]; if (!c.requis || k.indexOf('j_') === 0) return;
    if (!rempli(k)) m.push({ l: c.l.replace(/<[^>]+>/g, ''), ch: c.ch });
  });
  Object.keys(DECISIONS).forEach(id => {
    if (!S.choix[id]) { m.push({ l: 'Choix : ' + DECISIONS[id].q, ch: REG.decisions[id] }); m.push({ l: 'Justification : ' + DECISIONS[id].q, ch: REG.decisions[id] }); }
    else if (!rempli('j_' + id)) m.push({ l: 'Justification : ' + DECISIONS[id].q, ch: REG.decisions[id] });
  });
  Object.keys(SCENES).forEach(id => { const va = C.variantes[id]; if (!va || !(S.scenes[id] && S.scenes[id][va.id])) m.push({ l: 'Scène : ' + SCENES[id].titre, ch: REG.scenes[id] }); });
  QUALIF.forEach(q => { if (v('q_' + q.id) === 'oui' && !rempli('qj_' + q.id)) m.push({ l: 'Justification : ' + q.q, ch: 'dossier' }); });
  const parChapitre = {}; m.forEach(x => { parChapitre[x.ch] = (parChapitre[x.ch] || 0) + 1; });
  const total = Object.keys(REG.champs).filter(k => REG.champs[k].requis && k.indexOf('j_') !== 0).length + 2 * Object.keys(DECISIONS).length + Object.keys(SCENES).length;
  return { liste: m, parChapitre, taux: Math.max(0, Math.min(100, Math.round((total - m.length) / total * 100))) };
}

/* Le dossier : même contenu à l'écran, à l'impression et en texte */
function dossierHtml(C) {
  const t = cle => rempli(cle) ? esc(String(v(cle)).trim()) : `<span class="vide">à compléter</span>`;
  const ligne = (l, cle) => `<dt>${l}</dt><dd>${t(cle)}</dd>`;
  const qr = (l, cle) => `<h3>${l}</h3><p>${t(cle)}</p>`;
  const D = diagnostic(C), r = roi(), e = x => nb(x) + ' €';
  const choix = Object.keys(DECISIONS).map(id => { const o = DECISIONS[id].options.find(x => x.id === S.choix[id]);
    return `<tr><td>${DECISIONS[id].q}</td><td>${o ? o.l : '<span class="vide">à choisir</span>'}</td><td>${t('j_' + id)}</td></tr>`; }).join('');
  const scenes = Object.keys(SCENES).map(id => { const va = C.variantes[id]; if (!va) return '';
    const rep = va.reps.find(x => x.id === (S.scenes[id] && S.scenes[id][va.id]));

  const secours = () => { const z = document.createElement('textarea'); z.value = texte; z.style.position = 'fixed'; z.style.opacity = '0'; document.body.appendChild(z); z.select(); try { document.execCommand('copy'); fin(); } catch (e) { bref('Copie impossible : sélectionne le texte à la main.'); } z.remove(); };

}

/* Filet de sécurité : un projet effacé reste récupérable sur l'appareil, et son fichier part dans les téléchargements */
const CLE_SECOURS = CLE + '-secours';

async function nouveau() {
  const travail = !!S.maj;
  const texte = travail ? 'Ton fichier de projet part d\'abord dans tes téléchargements. Tout le travail affiché est ensuite effacé de cet appareil.' : 'La page repart d\'un projet vide.';

function lireFichier(f) {

    if (!d || d.app !== APP.id || typeof d.champs !== 'object') { bref('Ce fichier n\'est pas un fichier de projet de cet atelier.'); return; }

  }
  if (t.hasAttribute('data-fait')) { const id = t.getAttribute('data-fait'); S.faits[id] = t.checked; toucher(); t.closest('.etape').classList.toggle('faite', t.checked); majLeger(); return; }
  if (t.hasAttribute('data-coche')) { S.champs[t.getAttribute('data-coche')] = t.checked ? 'oui' : 'non'; toucher(); majLeger(); return; }
  if (t.tagName === 'SELECT' && t.hasAttribute('data-champ')) {
    const c = t.getAttribute('data-champ'); S.champs[c] = t.value; toucher();
    if (c === 'fr_clients') rendre(false); else majLeger();
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-action]'); if (!b) return;
  const a = b.getAttribute('data-action');
  if (a === 'nouveau') return nouveau();
  if (a === 'ouvrir') return ouvrir();
  if (a === 'enregistrer') return enregistrer();
  if (a === 'exporter') return exporter();
  if (a === 'recuperer') return recuperer();
  if (a === 'volet-nav') return basculer('nav');
  if (a === 'volet-etat') return basculer('etat');
  if (a === 'plus-tard') { rappelRepousse = Date.now() + 20 * 60000; $('rappel').hidden = true; return; }
  if (b.hasAttribute('data-copier')) {
    const idc = b.getAttribute('data-copier');
    if (idc === 'a1_analyse' || idc === 'a2_classer') figerJeu(true);
    const t = texteConsigne(idc);
    return copier(t, t.indexOf(VIDE) >= 0 ? 'Copié. Attention : il reste des passages à compléter.' : 'Consigne copiée. Colle-la dans Claude.');
  }
  if (b.hasAttribute('data-copier-jeu')) { const k = b.getAttribute('data-copier-jeu'); figerJeu(true); return copier((k === 'clients' ? jeuClients(nomJeu(), partJeu()) : jeuMessages(nomJeu())).csv, 'Données copiées.'); }
  if (b.hasAttribute('data-telecharger-jeu')) { const k = b.getAttribute('data-telecharger-jeu'); figerJeu(true); return telecharger(k === 'clients' ? 'clients-fictifs.csv' : 'messages-fictifs.csv', '﻿' + (k === 'clients' ? jeuClients(nomJeu(), partJeu()) : jeuMessages(nomJeu())).csv, 'text/csv;charset=utf-8'); }
  if (b.hasAttribute('data-scene')) {
    const id = b.getAttribute('data-scene'), va = b.getAttribute('data-variante'), rep = b.getAttribute('data-rep');
    S.scenes[id] = S.scenes[id] || {}; S.scenes[id][va] = rep; toucher(); rendre(false);
    const r = document.querySelector('[data-scene="' + id + '"][data-rep="' + rep + '"]'); if (r) r.focus({ preventScroll: true });
    return;
  }
  if (b.hasAttribute('data-radio')) {
    const c = b.getAttribute('data-radio'), val = b.getAttribute('data-valeur'); S.champs[c] = val; toucher(); rendre(false);
    const r = document.querySelector('[data-radio="' + c + '"][data-valeur="' + val + '"]'); if (r) r.focus({ preventScroll: true });
    return;
  }
  if (b.hasAttribute('data-idee')) return choisirIdee(b.getAttribute('data-idee'));
});
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey && e.code === 'KeyS') { e.preventDefault(); enregistrer(); }
  else if (mod && !e.altKey && e.code === 'KeyE') { e.preventDefault(); exporter(); }
  else if (e.altKey && !mod && e.code === 'KeyN') { e.preventDefault(); nouveau(); }
  else if (e.altKey && !mod && e.code === 'KeyO') { e.preventDefault(); ouvrir(); }
  else if (e.key === 'Escape') fermerVolets();
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (CHAPITRES.some(c => c.id === id)) { if (id !== S.chapitre) allerA(id, true); } });
window.addEventListener('beforeprint', preparerImpression);
/* À la fermeture : dernières saisies écrites tout de suite, et avertissement si le fichier de projet a du retard */
function sauverMaintenant() { if (!aSauver) return; clearTimeout(minuteur); aSauver = false; try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) {} }
window.addEventListener('pagehide', sauverMaintenant);
window.addEventListener('beforeunload', e => {
  sauverMaintenant();
  if ((S.modifs || 0) - (S.modifsExport || 0) >= 10) { e.preventDefault(); e.returnValue = ''; }
});
setInterval(verifierRappel, 60000);

/* ───────── Démarrage ───────── */
charger();
if (jeuDejaUtilise()) figerJeu(false);
/* Premier passage : chaque chapitre déclare ses étapes, ses champs et ses choix */
(function () { const C = calcul(); CHAPITRES.forEach(c => { CH = c.id; c.rendu(C); }); })();
(function () { const id = location.hash.slice(1); if (CHAPITRES.some(c => c.id === id)) S.chapitre = id; })();
typoNoeuds(document.querySelector('.barre')); typoNoeuds($('rappel'));
document.querySelectorAll('[title]').forEach(e => e.setAttribute('title', typo(e.getAttribute('title'))));
rendre(true);

})();
</script>
